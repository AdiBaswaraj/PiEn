<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#06101a" />
  <title>PiEn — Pirate Engine</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #06101a; color: #cfe0ff; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    #pien-canvas {
      display: block; width: 100%; height: 100%;
      background: #06101a; outline: none;
    }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      background: #06101a; z-index: 10; text-align: center; padding: 1rem;
    }
    #boot h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.04em; }
    #boot p  { margin: 0; opacity: 0.7; font-size: 0.9rem; max-width: 24rem; }
    .bar { width: 60%; max-width: 18rem; height: 4px; background: #1b2a3d; border-radius: 2px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0%; background: #8ab4ff; transition: width 0.2s; }
    #hint {
      position: fixed; left: 50%; bottom: 0.5rem; transform: translateX(-50%);
      font-size: 0.72rem; opacity: 0.55; pointer-events: none; z-index: 2;
      background: rgba(6, 16, 26, 0.4); padding: 2px 8px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="pien-canvas"></canvas>
    <div id="hint">left-thumb steer · right-thumb throttle · top-corners sail</div>
  </div>
  <div id="boot">
    <h1>PiEn — loading</h1>
    <div class="bar"><i id="bar"></i></div>
    <p id="boot-msg">Fetching engine… first load is ~20 MB. Subsequent loads are cached.</p>
  </div>
  <script type="module">
    import init from "./pien.js";
    const bar = document.getElementById("bar");
    const boot = document.getElementById("boot");
    const msg = document.getElementById("boot-msg");

    async function fetchWithProgress(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("wasm fetch failed: " + res.status);
      const total = Number(res.headers.get("content-length")) || 0;
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total) bar.style.width = (received / total * 100).toFixed(1) + "%";
      }
      const buf = new Uint8Array(received);
      let offset = 0;
      for (const c of chunks) { buf.set(c, offset); offset += c.length; }
      return buf.buffer;
    }

    try {
      const wasmBuffer = await fetchWithProgress("./pien_bg.wasm");
      msg.textContent = "Compiling…";
      bar.style.width = "100%";
      await init({ module_or_path: wasmBuffer });
      boot.style.display = "none";
    } catch (e) {
      msg.textContent = "Failed to start: " + e.message;
      console.error(e);
    }
  </script>
</body>
</html>
